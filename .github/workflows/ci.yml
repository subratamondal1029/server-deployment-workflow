# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o app ./cmd/deployment

      - uses: actions/upload-artifact@v4
        with:
          name: app-binary
          path: app

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-binary

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app \
            --repo "${{ github.repository }}" \
            --title "v${{ github.run_number }}" \
            --notes "Automated release from commit ${{ github.sha }}"

  deploy:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-binary

      - name: Install Cloudflared
        run: |
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-main.gpg

          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main" \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list

          sudo apt-get update -y
          sudo apt-get install cloudflared -y

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/github_ci
          chmod 600 ~/.ssh/github_ci

      - name: Copy binary to vps
        run: |
          scp \
            -i ~/.ssh/github_ci \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            app root@ssh.subratamondal.dev:/opt/app/app

      - name: Run container in server
        run: |
          ssh \
            -i ~/.ssh/github_ci \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="cloudflared access ssh --hostname %h" \
            root@ssh.subratamondal.dev << EOF
          set -e
          cd /opt/app
          chmod +x ./app
          
          ./docker-run.sh "${{ github.run_number }}"
          docker logs server
          EOF

